  :root { --ground:#FFF; --ink:#17130F; --ink-2:#4A423A; --line:#E4DDD1; --accent:#8A5716; }

  }

  ul { list-style:none; padding:0; margin:0; }
  li { border-top:1px solid var(--line); }
  li:last-child { border-bottom:1px solid var(--line); }
  a { display:block; padding:1rem 0; color:var(--accent); text-decoration:none; font-weight:600; }
